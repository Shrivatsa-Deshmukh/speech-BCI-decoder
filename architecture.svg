<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 354" width="960" height="354" role="img" aria-labelledby="t d">
  <title id="t">Speech BCI Decoder overview</title>
  <desc id="d">Neural recordings from 128 electrodes during attempted speech are decoded by a GRU phoneme decoder (this repo) into a phoneme sequence. The language model stage that turns phonemes into words is not implemented.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#1f2328; --muted:#656d76; --faint:#d0d7de; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#e6edf3; --muted:#8d96a0; --faint:#30363d; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--ink); }
    .bg { fill:var(--bg); }
    .h1 { font-size:20px; font-weight:600; }
    .sub { font-size:12.5px; fill:var(--muted); }
    .ttl { font-size:14px; font-weight:600; }
    .tag { font-size:11px; font-weight:700; letter-spacing:0.12em; }
    .row { font-size:13px; }
    .rowd { font-size:12px; fill:var(--muted); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; }
    .faded { fill:var(--muted); }
    .big { font-size:30px; font-weight:700; }
    .bigm { font-size:30px; font-weight:400; fill:var(--muted); }
    .box { fill:none; stroke:var(--ink); stroke-width:1.2; }
    .main { fill:none; stroke:var(--ink); stroke-width:2.2; }
    .ghost { fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:5 4; }
    .rule { stroke:var(--faint); stroke-width:1; }
    .arrow { stroke:var(--ink); stroke-width:1.5; fill:none; }
    .arrowg { stroke:var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
    .head { fill:var(--ink); }
    .headg { fill:var(--muted); }
    .dot { fill:var(--ink); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="headg"/></marker>
  </defs>
  <rect class="bg" width="960" height="354"/>

  <text class="h1" x="20" y="34">Speech BCI Decoder</text>
  <text class="sub" x="20" y="54">Decoding attempted speech from intracortical recordings into phonemes</text>

