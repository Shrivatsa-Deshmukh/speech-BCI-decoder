  <text class="sub" x="115" y="226" text-anchor="middle">attempted speech</text>
  <text class="sub" x="115" y="244" text-anchor="middle">128 electrodes</text>
  <text class="mono" x="115" y="272" text-anchor="middle">T × 256 · 20 ms bins</text>

  <line class="arrow" x1="210" y1="209" x2="238" y2="209" marker-end="url(#a)"/>

  <!-- Decoder -->
  <text class="tag" x="240" y="76">THIS REPO</text>
  <rect class="main" x="240" y="84" width="290" height="250" rx="10"/>
  <text class="ttl" x="258" y="112">GRU phoneme decoder</text>
  <line class="rule" x1="258" y1="124" x2="514" y2="124"/>
  <text class="row" x="258" y="150">Gaussian smoothing</text><text class="rowd" x="514" y="150" text-anchor="end">σ = 2</text>
  <text class="row" x="258" y="182">Day-specific transform</text><text class="rowd" x="514" y="182" text-anchor="end">per session</text>
  <text class="row" x="258" y="214">Temporal unfold</text><text class="rowd" x="514" y="214" text-anchor="end">32 bins, stride 4</text>
  <text class="row" x="258" y="246">Bidirectional GRU</text><text class="rowd" x="514" y="246" text-anchor="end">5 layers × 512</text>
  <text class="row" x="258" y="278">Linear</text><text class="rowd" x="514" y="278" text-anchor="end">41 classes</text>
  <text class="row" x="258" y="310">CTC</text><text class="rowd" x="514" y="310" text-anchor="end">greedy decode</text>

